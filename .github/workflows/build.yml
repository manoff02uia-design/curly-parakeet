name: Build Rust
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  android:
    name: Android .so (${{ matrix.abi }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a      target: aarch64-linux-android
          - abi: armeabi-v7a    target: armv7-linux-androideabi
          - abi: x86_64         target: x86_64-linux-android
          - abi: x86            target: i686-linux-android
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: Build libdumplib.so
        run: cargo ndk -t ${{ matrix.target }} -o ./jniLibs build --release -p android-lib
      - uses: actions/upload-artifact@v4
        with:
          name: so-${{ matrix.abi }}
          path: jniLibs/${{ matrix.abi }}/libdumplib.so

  cli:
    name: CLI (Linux x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --release -p dumplib-cli
      - uses: actions/upload-artifact@v4
        with:
          name: dumplib-cli-linux
          path: target/release/dumplib

  cli-windows:
    name: CLI (Windows x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - name: Install mingw
        run: sudo apt-get install -y gcc-mingw-w64-x86-64
      - name: Build
        run: cargo build --release --target x86_64-pc-windows-gnu -p dumplib-cli
      - uses: actions/upload-artifact@v4
        with:
          name: dumplib-cli-windows
          path: target/x86_64-pc-windows-gnu/release/dumplib.exe
          
